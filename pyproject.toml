[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurante-predictivo"
version = "0.1.0"
description = "Local restaurant operations and ingredient purchasing forecasts"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.42,<2", "pandas>=2.2,<4", "numpy>=2,<3",
  "scikit-learn>=1.5,<2", "plotly>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
