services:
  - type: web
    name: mise-restaurante-tesis
    runtime: python
    repo: https://github.com/JosephChomboM/proyecto-tesis
    branch: main
    region: oregon
    plan: free
    numInstances: 1
    buildCommand: python -m pip install --require-hashes -r requirements.lock && python -m pip install --no-deps .
    startCommand: python scripts/start.py
    healthCheckPath: /_stcore/health
    autoDeployTrigger: "off"
    envVars:
      - key: RESTAURANTE_DATA_DIR
        value: /tmp/mise-restaurante
      - key: RESTAURANTE_PUBLIC_DEMO
        value: "true"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
